services:
  app:
    build: .
    # Avoid inheriting host-only Tailscale resolvers, which fail in this bridge.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    ports:
      - "3051:3051"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - PORT=3051
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3051/json').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 600s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--appendonly", "yes", "--port", "6380"]
    ports:
      - "6380:6380"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
